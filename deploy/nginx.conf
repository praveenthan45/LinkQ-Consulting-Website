# Replace the server_name and certificate paths with the approved production domain.
# Place in /etc/nginx/sites-available/linkq; link it into sites-enabled after editing.
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    root /srv/linkq/dist;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Avoid retaining visitor network addresses in access logs.
    access_log off;
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite incoming forwarding data; Express trusts this one proxy only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /images/ { try_files $uri =404; expires 30d; }
    location /fonts/ { try_files $uri =404; expires 30d; }
    location ~ ^/events/[a-z0-9-]+/?$ {
        proxy_pass http://127.0.0.1:3001;
    }
    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
