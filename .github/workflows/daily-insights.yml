name: Daily Industry Insights

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-industry-insights
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Collect and prepare today's posts
        run: npx --no-install tsx scripts/publish-insights.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Verify and publish
        run: |
          if git diff --quiet -- src/content/dailyInsights.json; then
            exit 0
          fi
          npm run build
          npm run check:build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/dailyInsights.json
          git commit -m "Publish daily industry insights"
          git push origin HEAD:main
